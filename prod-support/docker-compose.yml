name: mks-reservation

services:
  mks-reservation-web:
    container_name: mks-reservation-web
    build:
      context: ..
      dockerfile: prod-support/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mks-reservation-mongo:27017/mks_reservation}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_ACCESS_PASSWORD: ${ADMIN_ACCESS_PASSWORD}
      RESERVATION_QUOTA_LIMIT: ${RESERVATION_QUOTA_LIMIT:-64}
      RESERVATION_CHECK_IN_EARLY_MINUTES: ${RESERVATION_CHECK_IN_EARLY_MINUTES:-15}
      RESERVATION_CHECK_IN_GRACE_MINUTES: ${RESERVATION_CHECK_IN_GRACE_MINUTES:-15}
      RESERVATION_LIFECYCLE_POLL_MS: ${RESERVATION_LIFECYCLE_POLL_MS:-30000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://mks.example.ntuee.org}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_API_TIMEOUT_MS: ${EMAIL_API_TIMEOUT_MS:-15000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-15000}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-10000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-20000}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-15}
      AUTO_SEED_DATA: ${AUTO_SEED_DATA:-true}
      FILE_STORAGE_ROOT: /app/storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
    ports:
      - "4000:4000"
    expose:
      - "4000"
    depends_on:
      - mks-reservation-mongo
    volumes:
      - fabrication_files:/app/storage
    networks:
      - mks-reservation
      - nginx
    restart: unless-stopped

  mks-reservation-slicer:
    container_name: mks-reservation-slicer
    build:
      context: ..
      dockerfile: prod-support/Dockerfile
    command: ["npm", "run", "worker:slicer"]
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mks-reservation-mongo:27017/mks_reservation}
      FILE_STORAGE_ROOT: /app/storage
      BAMBU_STUDIO_CLI: /opt/bambu-studio/bambu-studio
      BAMBU_STUDIO_USE_XVFB: ${BAMBU_STUDIO_USE_XVFB:-true}
      BAMBU_MACHINE_PROFILE: /opt/bambu-profiles/machine.json
      BAMBU_PROCESS_PROFILE: /opt/bambu-profiles/process.json
      BAMBU_FILAMENT_PROFILE: /opt/bambu-profiles/filament.json
      BAMBU_PROFILE_VERSION: ${BAMBU_PROFILE_VERSION:-P1S-0.4-Bambu-PLA-Basic}
      SLICER_TIMEOUT_MS: ${SLICER_TIMEOUT_MS:-300000}
      SLICER_STALE_LOCK_MS: ${SLICER_STALE_LOCK_MS:-900000}
    depends_on:
      - mks-reservation-mongo
    volumes:
      - fabrication_files:/app/storage
      - ${BAMBU_STUDIO_DIR:-./bambu-studio}:/opt/bambu-studio:ro
      - ${BAMBU_PROFILE_DIR:-./bambu-profiles}:/opt/bambu-profiles:ro
    networks:
      - mks-reservation
    restart: unless-stopped

  mks-reservation-mongo:
    container_name: mks-reservation-mongo
    image: mongo:7
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mks-reservation
    restart: unless-stopped

volumes:
  mongo_data:
  fabrication_files:

networks:
  nginx:
    external: true
  mks-reservation:
